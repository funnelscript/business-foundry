[project]
name = "business-foundry"
version = "0.1.0"
description = "Business Foundry & Meta-Ontology Suite for FunnelScript"
requires-python = ">=3.12"
dependencies = [
    "funnelscript",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
funnelscript = { path = "../funnelscript", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto"
